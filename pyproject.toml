[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkpipe-realdata"
version = "0.7.0"
description = "Authority-typed real-data environmental and atom-interferometer validation"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{name = "Facundo Firmenich"}]
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "requests>=2.32", "matplotlib>=3.9"]
keywords = ["geomagnetism", "solar-wind", "atom-interferometry", "quantum-sensing", "open-data"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
darkpipe = "darkpipe.cli:main"

[project.urls]
Repository = "https://github.com/FacundoFirmenich/darkpipe-realdata"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
