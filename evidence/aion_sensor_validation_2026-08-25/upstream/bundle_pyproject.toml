[project]
name = "dai-paper-figures"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.0",
    "matplotlib>=3.8.3",
    "scipy>=1.15.3",
    "scienceplots>=2.1.1",
    "brokenaxes>=0.6.2",
    "arviz>=0.22.0",
    "uncertainties>=3.1.7",
    "seaborn>=0.13.2",
    "allantools>=2019.9",
    "tqdm>=4.66.2",
    "openpyxl>=3.1.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
    "jupytext>=1.19.1",
    "nbclient>=0.10.4",
    "nbconvert>=7.17.1",
    "pip>=26.0.1",
    "pre-commit>=4.2.0",
    "ruff>=0.15.10",
    "uv>=0.11.6",
]

[tool.uv]
# This project contains scripts and notebooks only, not an installable package.
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]  # module-level import not at top (normal in notebooks)

