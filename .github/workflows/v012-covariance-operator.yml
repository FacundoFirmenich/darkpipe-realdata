name: v0.12 covariance-aware deprojection operator shadow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .[test]
      - name: Verify frozen source bytes and v0.12 implementation
        run: python -m pytest tests/test_covariance_operator_shadow.py -q
      - name: Derive compact covariance/operator evidence
        run: >-
          python run_darkpipe_covariance_operator_v012.py
          --output-dir darkpipe_v012_result
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: darkpipe-v012-covariance-operator
          path: darkpipe_v012_result/
          if-no-files-found: error
          retention-days: 90
