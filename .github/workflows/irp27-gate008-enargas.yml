name: IRP27 Gate 008 — ENARGAS raw acquisition

on:
  push:
    branches:
      - irp27-gate008-enargas-acquisition
    paths:
      - ".github/workflows/irp27-gate008-enargas.yml"
      - "research/irp27_gate008/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests openpyxl

      - name: Acquire and inspect six official workbooks
        id: acquire
        continue-on-error: true
        run: |
          python research/irp27_gate008/fetch_enargas.py \
            --output "$RUNNER_TEMP/irp27_gate008"

      - name: Show acquisition summary
        if: always()
        run: |
          find "$RUNNER_TEMP/irp27_gate008" -maxdepth 3 -type f -printf '%P\t%s bytes\n' | sort
          echo "--- acquisition_status.json ---"
          cat "$RUNNER_TEMP/irp27_gate008/acquisition_status.json" || true

      - name: Upload raw and parsed artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irp27-gate008-enargas-raw-and-parse
          path: ${{ runner.temp }}/irp27_gate008
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce six-workbook materialization gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("${{ runner.temp }}/irp27_gate008/acquisition_status.json")
          status = json.loads(p.read_text(encoding="utf-8"))
          expected = status["expected_workbooks"]
          acquired = status["acquired_workbooks"]
          valid = status["valid_xlsx_workbooks"]
          print({"expected": expected, "acquired": acquired, "valid_xlsx": valid})
          if acquired != expected or valid != expected:
              raise SystemExit("Gate failed closed: not all six official XLSX workbooks were acquired and validated.")
          PY
