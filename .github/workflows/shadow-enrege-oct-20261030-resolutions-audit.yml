name: ENReGE October 2026 resolution index delta review 20261030
on:
  push:
    branches:
      - shadow/tarifa-octubre-official-check-20261030
    paths:
      - .github/workflows/shadow-enrege-oct-20261030-resolutions-audit.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture live resolution labels, destinations and metadata without mutation
        run: |
          set -euo pipefail
          mkdir -p audit_resolutions_output
          python3 - <<'PY'
          import hashlib,html,json,re
          from datetime import datetime,timezone
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request,urlopen
          from pathlib import Path
          url="https://www.enargas.gob.ar/secciones/precios-y-tarifas/resoluciones-tarifas-vigentes.php"
          req=Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; TarifaAbiertaReadOnlyVerification/1.0)"})
          with urlopen(req,timeout=70) as resp:
              raw=resp.read()
              meta={"checked_at_utc":datetime.now(timezone.utc).isoformat(),"url_final":resp.geturl(),"http_status":resp.status,"mime":resp.headers.get("Content-Type"),"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}
          page=raw.decode("utf-8",errors="replace")
          records=[]
          for code in sorted(set(re.findall(r"RESFC2026-\\d{4}",html.unescape(page)))):
              pos=page.find(code)
              left=page.rfind("<tr",0,pos)
              right=page.find("</tr>",pos)
              frag=page[left:right+5] if left>=0 and right>=0 else page[max(0,pos-500):pos+500]
              text=" ".join(html.unescape(re.sub(r"<[^>]*>"," ",frag)).split())
              hrefs=re.findall(r"href\\s*=\\s*[\\\"']([^\\\"']+)",frag,re.I)
              records.append({"code":code,"row_text":text[:500],"hrefs":[urljoin(url,x) for x in hrefs]})
          meta["resolutions"]=records
          Path("audit_resolutions_output/resolution_delta_20261030.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2)+"\\n")
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: enrege-october-20261030-resolution-index-delta
          path: audit_resolutions_output/
          retention-days: 30
          if-no-files-found: error
