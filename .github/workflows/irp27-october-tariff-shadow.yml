name: IRP27 October 2026 gas tariff — source verification
on:
  push:
    branches: [irp27-energy-october-shadow-v16]
    paths:
      - ".github/workflows/irp27-october-tariff-shadow.yml"
      - "research/irp27_energy_vertical/acquire_october_2026.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install XLSX reader
        run: python -m pip install openpyxl
      - name: Acquire official October XLSX and compute raw SHA-256
        id: raw
        continue-on-error: true
        run: python research/irp27_energy_vertical/acquire_october_2026.py "$RUNNER_TEMP/irp27-oct-2026"
      - name: Show acquisition facts
        if: always()
        run: |
          cat "$RUNNER_TEMP/irp27-oct-2026/status.json" || true
          ls -lah "$RUNNER_TEMP/irp27-oct-2026" || true
      - name: Preserve raw bytes and acquisition ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irp27-october-2026-official-raw
          path: ${{ runner.temp }}/irp27-oct-2026/
          if-no-files-found: warn
          retention-days: 30
      - name: Fail closed when XLSX not materialized
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("${{ runner.temp }}/irp27-oct-2026/status.json")
          if not p.exists(): raise SystemExit("RAW_BYTES_NOT_MATERIALIZED")
          s=json.loads(p.read_text())
          if not s.get("valid_xlsx") or not s.get("size_bytes",0):
              raise SystemExit("RAW_XLSX_UNVERIFIED")
          PY
