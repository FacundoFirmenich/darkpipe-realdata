name: ENReGE 2026-11-02 official material-diff audit
on:
  push:
    branches:
      - shadow/enrege-watch-20261102
    paths:
      - ".github/workflows/enrege-official-check-20261102.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-byte-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP and HTML parsing dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Independent HTTPS GET for official workbook, indices and annexes
        run: |
          set -euo pipefail
          sed 's/watch_20261101/watch_20261102/g' research/tarifa_abierta/audit/watch_20261101/check_official_bytes.py > /tmp/check_enrege_20261102.py
          python /tmp/check_enrege_20261102.py
      - name: Present material-diff status without publishing or merging
        if: always()
        run: |
          cat research/tarifa_abierta/audit/watch_20261102/SUMMARY.txt || true
          test -f research/tarifa_abierta/audit/watch_20261102/audit.json && python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/tarifa_abierta/audit/watch_20261102/audit.json")
          doc=json.loads(p.read_text())
          print(json.dumps({"state":doc["state"],"checked_at_utc":doc["checked_at_utc"],"verification_complete":doc["verification_complete"],"material_changes":doc["material_changes"],"sources":[{"id":r["id"],"requested_url":r["requested_url"],"final_url":r.get("final_url"),"checked_at_utc":r.get("checked_at_utc"),"http":r.get("http_status"),"mime":r.get("mime"),"bytes":r.get("bytes"),"sha256":r.get("sha256"),"last_modified":r.get("http_last_modified"),"error":r.get("error")} for r in doc["sources"]]},ensure_ascii=False,indent=2))
          PY
      - name: Preserve strict SHADOW byte audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrege-watch-20261102-material-only
          path: research/tarifa_abierta/audit/watch_20261102/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
