name: DarkPipe v0.9 GPS network calibration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darkpipe-v09-gps-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Calibrate only on 42 pre-target days
        id: calibration
        continue-on-error: true
        run: >-
          python run_darkpipe_gps_network_v09.py
          --stage calibrate
          --output "$RUNNER_TEMP/darkpipe-v09-calibration"
      - name: Upload compact calibration evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: darkpipe-v09-gps-calibration
          path: ${{ runner.temp }}/darkpipe-v09-calibration
          if-no-files-found: error
          retention-days: 30
      - name: Require a scientific terminal calibration decision
        if: always()
        run: >-
          python -c "import json,pathlib;
          p=pathlib.Path(r'${{ runner.temp }}/darkpipe-v09-calibration/calibration_result.json');
          assert p.is_file(), 'calibration did not reach a scientific terminal state';
          d=json.loads(p.read_text());
          assert d['decision'] in
          {'CALIBRATION_GREEN_TARGET_MAY_OPEN',
          'ABSTAIN_INSUFFICIENT_POWER_TARGET_MUST_REMAIN_CLOSED'}"
