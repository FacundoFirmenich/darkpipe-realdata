name: IRP27 SOTA-009 — Argentine bilingual corpus

on:
  push:
    branches: [irp27-in-domain-bilingual-gold-v18]
    paths:
      - ".github/workflows/irp27-sota009-argentine-corpus.yml"
      - "research/irp27_sota009/corpus_payload/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_XET: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install acquisition and translation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.46,<5" sentencepiece sacremoses requests beautifulsoup4 lxml
      - name: Reassemble, verify and compile blind corpus builder
        run: |
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          root=Path('research/irp27_sota009')
          parts=sorted((root/'corpus_payload').glob('corpus_*.part'))
          assert len(parts)==4, parts
          text=''.join(path.read_text(encoding='ascii') for path in parts).strip()
          text += '=' * ((4-len(text)%4)%4)
          payload=base64.b64decode(text,validate=True)
          source=gzip.decompress(payload)
          assert source.startswith(b'#!/usr/bin/env python3')
          target=root/'build_argentine_corpus_v3_blind.py'
          target.write_bytes(source)
          print({'parts':len(parts),'base64_chars':len(text),'gzip_bytes':len(payload),'source_bytes':len(source),'source_sha256':hashlib.sha256(source).hexdigest()})
          PY
          python -m py_compile research/irp27_sota009/build_argentine_corpus_v3_blind.py
      - name: Build balanced ClaimReview-verified blind corpus
        run: |
          python research/irp27_sota009/build_argentine_corpus_v3_blind.py \
            --output "${{ runner.temp }}/irp27_argentine_gold_v18" \
            --target-per-domain 40 \
            --max-pages 100 \
            --oversample 12
      - name: Print exact corpus state
        if: always()
        run: |
          cat "${{ runner.temp }}/irp27_argentine_gold_v18/status.json" || true
          cat "${{ runner.temp }}/irp27_argentine_gold_v18/errors.json" || true
          du -sh "${{ runner.temp }}/irp27_argentine_gold_v18" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irp27-sota009-argentine-corpus
          path: ${{ runner.temp }}/irp27_argentine_gold_v18
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Enforce corpus and authority boundaries
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path("${{ runner.temp }}/irp27_argentine_gold_v18/status.json").read_text())
          assert status['selected_claims'] == 240
          assert set(status['domain_distribution'].values()) == {40}
          assert status['annotation_assignments'] == 720
          assert status['gold_labels_completed'] == 0
          assert status['translations_human_reviewed'] == 0
          assert status['machine_translation_drafts'] == 240
          assert status['automatic_publication'] is False
          print('CORPUS BOUNDARY PASS')
          PY
