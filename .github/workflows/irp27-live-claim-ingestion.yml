name: IRP27 Gate 015 — live claim ingestion
on:
  push:
    branches: [irp27-live-claim-ingestion-v05]
    paths:
      - ".github/workflows/irp27-live-claim-ingestion.yml"
      - "research/irp27_live_claims/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4 pypdf cryptography
      - name: Unit tests
        working-directory: research/irp27_live_claims
        run: python -m unittest -v test_live_claim_engine.py
      - name: Acquire, verify and ingest live claims
        run: |
          python research/irp27_live_claims/run_live_ingestion.py \
            --registry research/irp27_live_claims/live_claim_registry.json.gz.b64 \
            --atlas research/irp27_live_claims/atlas_claims_min.json \
            --output "$RUNNER_TEMP/irp27_live_claims"
      - if: always()
        run: |
          cat "$RUNNER_TEMP/irp27_live_claims/status.json" || true
          cat "$RUNNER_TEMP/irp27_live_claims/errors.json" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irp27-live-claim-ingestion-v05
          path: ${{ runner.temp }}/irp27_live_claims
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("${{ runner.temp }}/irp27_live_claims/status.json").read_text())
          if s['sources_acquired'] != s['sources_expected']: raise SystemExit('Source acquisition incomplete')
          if s['verified_fragments'] != s['events']: raise SystemExit('At least one exact source fragment was not verified')
          if s['automatic_publication']: raise SystemExit('Automatic publication boundary violated')
          PY
