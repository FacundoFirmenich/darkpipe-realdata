name: IRP27 Gate SOTA-009 — Argentine bilingual gold pilot

on:
  push:
    branches: [irp27-arg-bilingual-gold-v18-final]
    paths:
      - ".github/workflows/irp27-arg-bilingual-gold-v18.yml"
      - "research/irp27_arg_bilingual_gold/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_XET: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU data and translation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.46,<5" sentencepiece sacremoses requests beautifulsoup4 pypdf cryptography openpyxl scikit-learn numpy
      - name: Compile and run fail-closed tests
        working-directory: research/irp27_arg_bilingual_gold
        run: |
          python -m py_compile build_argentine_gold.py build_argentine_gold_v2.py adjudicate_annotations.py
          python -m unittest -v test_build_argentine_gold.py test_adjudicate_annotations.py
      - name: Build 240-claim bilingual annotation corpus
        run: |
          python research/irp27_arg_bilingual_gold/build_argentine_gold_v2.py \
            --registry research/irp27_arg_bilingual_gold/source_registry.json \
            --output "$RUNNER_TEMP/irp27_arg_bilingual_gold_v18" \
            --translation-model Helsinki-NLP/opus-mt-es-en
      - name: Exercise empty-response adjudication gate
        run: |
          printf '[]\n' > "$RUNNER_TEMP/no_responses.json"
          python research/irp27_arg_bilingual_gold/adjudicate_annotations.py \
            --pairs "$RUNNER_TEMP/irp27_arg_bilingual_gold_v18/data/candidate_pairs_960.jsonl" \
            --assignments "$RUNNER_TEMP/irp27_arg_bilingual_gold_v18/data/assignments_2880.csv" \
            --responses "$RUNNER_TEMP/no_responses.json" \
            --output "$RUNNER_TEMP/irp27_arg_bilingual_gold_v18/adjudication"
          cp research/irp27_arg_bilingual_gold/build_argentine_gold.py "$RUNNER_TEMP/irp27_arg_bilingual_gold_v18/"
          cp research/irp27_arg_bilingual_gold/build_argentine_gold_v2.py "$RUNNER_TEMP/irp27_arg_bilingual_gold_v18/"
          cp research/irp27_arg_bilingual_gold/adjudicate_annotations.py "$RUNNER_TEMP/irp27_arg_bilingual_gold_v18/"
      - name: Print exact corpus state
        if: always()
        run: |
          cat "$RUNNER_TEMP/irp27_arg_bilingual_gold_v18/reports/QA_REPORT.json" || true
          cat "$RUNNER_TEMP/irp27_arg_bilingual_gold_v18/reports/ERRORS.json" || true
          cat "$RUNNER_TEMP/irp27_arg_bilingual_gold_v18/adjudication/agreement_report.json" || true
          du -sh "$RUNNER_TEMP/irp27_arg_bilingual_gold_v18" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irp27-arg-bilingual-gold-v18
          path: ${{ runner.temp }}/irp27_arg_bilingual_gold_v18
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Enforce scientific boundaries
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("${{ runner.temp }}/irp27_arg_bilingual_gold_v18")
          qa=json.loads((root/'reports/QA_REPORT.json').read_text())
          agreement=json.loads((root/'adjudication/agreement_report.json').read_text())
          assert qa['claims'] == 240
          assert set(qa['domain_counts'].values()) == {40}
          assert qa['pairs'] == 960
          assert qa['assignments'] == 2880
          assert qa['pilot_claims'] == 60
          assert qa['pilot_pairs'] == 240
          assert qa['pilot_assignments'] == 720
          assert qa['sources_acquired'] == qa['sources_expected'] == 37
          assert qa['errors'] == []
          assert qa['human_annotations_collected'] == 0
          assert qa['adjudicated_items'] == 0
          assert qa['gold_status'] == 'NOT_YET_GOLD'
          assert qa['automatic_evidence_promotion'] is False
          assert qa['automatic_publication'] is False
          assert min(qa['assignment_counts'].values()) == max(qa['assignment_counts'].values())
          assert agreement['responses_valid'] == 0
          assert agreement['items_adjudicated'] == 0
          assert agreement['gold_frozen'] is False
          assert agreement['automatic_majority_as_gold'] is False
          print('BOUNDARY GATE PASS')
          PY
