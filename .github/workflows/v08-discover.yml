name: DarkPipe v0.8 independent-epoch discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Development-only independent epoch discovery
        run: >
          python run_darkpipe_aion_independent_search_v08.py
          --mode discover
          --output v08_discovery
          --scratch "$RUNNER_TEMP/darkpipe-v08"
          --preregistration-commit "$GITHUB_SHA"
      - name: Assert raw source was removed
        run: >
          test ! -f
          "$RUNNER_TEMP/darkpipe-v08/000034056-DifferentialClockInterferometryWithNoiseFrag.h5"
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: darkpipe-v08-development-candidates
          path: v08_discovery
          if-no-files-found: error
