name: IRP27 Gate SOTA-011 — decision contract compiler

on:
  push:
    branches: [irp27-decision-contract-compiler-v20]
    paths:
      - ".github/workflows/irp27-decision-contract-compiler-v20.yml"
      - "research/irp27_decision_contract_compiler/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_XET: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  SYS1_EVAL_COMMIT: "e74dfb6d99ed041f5f5240af386ba5272de84cdd"

jobs:
  compile-prove-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install compiler and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema numpy scipy scikit-learn pytest requests

      - name: Decode frozen Gate 011 payload
        run: |
          set -euo pipefail
          ROOT="research/irp27_decision_contract_compiler"
          mkdir -p "$ROOT/work"
          base64 --decode "$ROOT/gate011_payload.tar.gz.b64" | tar -xzf - -C "$ROOT/work"
          find "$ROOT/work" -maxdepth 3 -type f -printf '%P\n' | sort

      - name: Compile Python and run contract tests
        env:
          PYTHONPATH: research/irp27_decision_contract_compiler/work/src
        run: |
          python -m compileall \
            research/irp27_decision_contract_compiler/work/src \
            research/irp27_decision_contract_compiler/work/tests
          pytest -q research/irp27_decision_contract_compiler/work/tests

      - name: Compile canonical decision contract
        env:
          PYTHONPATH: research/irp27_decision_contract_compiler/work/src
        run: |
          OUT="$RUNNER_TEMP/irp27_gate011"
          mkdir -p "$OUT/compiled"
          python research/irp27_decision_contract_compiler/work/src/decision_contract_compiler.py \
            --contract research/irp27_decision_contract_compiler/work/contracts/evidence_relation.contract.json \
            --schema research/irp27_decision_contract_compiler/work/protocols/decision_contract.schema.json \
            --output "$OUT/compiled"
          cat "$OUT/compiled/compiler_manifest.json"

      - name: Install Lean 4.35.0
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | \
            sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          source "$HOME/.elan/env"
          lean --version
          lake --version

      - name: Prove generated contract obligations
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          PROJECT="research/irp27_lean_decision_governance"
          OUT="$RUNNER_TEMP/irp27_gate011"
          cp "$OUT/compiled/CompiledContract.lean" "$PROJECT/DecisionGov/CompiledContract.lean"
          (
            cd "$PROJECT"
            lake build
            lake env lean DecisionGov/CompiledContract.lean
          )
          if grep -R --line-number --extended-regexp '\bsorry\b|admit|axiom[[:space:]]' \
              "$PROJECT/DecisionGov" "$OUT/compiled/CompiledContract.lean"; then
            echo 'Unfinished or assumed proof detected'
            exit 1
          fi
          LEAN_VERSION="$(lean --version | head -1)"
          LAKE_VERSION="$(lake --version | head -1)"
          python - <<PY
          import hashlib, json
          from pathlib import Path
          out=Path("$OUT")
          compiled=out/'compiled/CompiledContract.lean'
          manifest=json.loads((out/'compiled/compiler_manifest.json').read_text())
          (out/'formal_contract_verification.json').write_text(json.dumps({
              'verified': True,
              'lean_version': "$LEAN_VERSION",
              'lake_version': "$LAKE_VERSION",
              'contract_id': manifest['contract_id'],
              'contract_hash': manifest['contract_hash'],
              'proof_file': 'CompiledContract.lean',
              'proof_sha256': hashlib.sha256(compiled.read_bytes()).hexdigest(),
              'sorry_admit_axiom_count_allowed': 0,
              'automatic_execution': False,
              'automatic_publication': False
          }, indent=2)+'\n')
          PY

      - name: Acquire pinned external benchmark cases and raw provider outputs
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/irp27_gate011"
          RAW="$OUT/external_raw"
          mkdir -p "$RAW"
          python - <<'PY'
          import hashlib, json, os, requests
          from pathlib import Path
          commit=os.environ['SYS1_EVAL_COMMIT']
          root=Path(os.environ['RUNNER_TEMP'])/'irp27_gate011/external_raw'
          names=[
            'bench/cases.jsonl',
            'bench/cases-flip.jsonl',
            'results/laya.jsonl',
            'results/jev.jsonl',
            'results/laya-flip.jsonl',
            'results/jev-flip.jsonl',
          ]
          registry=[]
          for remote in names:
              url=f'https://raw.githubusercontent.com/David-DL-Space/sys1-eval/{commit}/{remote}'
              response=requests.get(url,timeout=300)
              response.raise_for_status()
              path=root/Path(remote).name
              path.write_bytes(response.content)
              registry.append({
                  'repository':'David-DL-Space/sys1-eval',
                  'commit':commit,
                  'remote_path':remote,
                  'url':url,
                  'local_path':path.name,
                  'bytes':len(response.content),
                  'sha256':hashlib.sha256(response.content).hexdigest(),
                  'retrieved_status':response.status_code,
              })
          (root/'SOURCE_REGISTRY.json').write_text(json.dumps(registry,indent=2)+'\n')
          print(json.dumps(registry,indent=2))
          PY

      - name: Reanalyse published Jev and Laya raw outputs in shadow
        env:
          PYTHONPATH: research/irp27_decision_contract_compiler/work/src
        run: |
          OUT="$RUNNER_TEMP/irp27_gate011"
          RAW="$OUT/external_raw"
          mkdir -p "$OUT/shadow_benchmark"
          python research/irp27_decision_contract_compiler/work/src/shadow_benchmark.py \
            --cases "$RAW/cases.jsonl" \
            --providers "$RAW/laya.jsonl" "$RAW/jev.jsonl" \
            --provider-names laya_public_raw jev_public_raw \
            --variant-cases "$RAW/cases-flip.jsonl" \
            --variant-providers "$RAW/laya-flip.jsonl" "$RAW/jev-flip.jsonl" \
            --output "$OUT/shadow_benchmark"

      - name: Attempt live Laya shadow run without granting authority
        id: live_laya
        continue-on-error: true
        env:
          PYTHONPATH: research/irp27_decision_contract_compiler/work/src
        run: |
          set -u
          OUT="$RUNNER_TEMP/irp27_gate011"
          LIVE="$OUT/live_laya"
          RAW="$OUT/external_raw"
          mkdir -p "$LIVE"
          START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          python -m pip install laya
          INSTALL_RC=$?
          RUN_RC=99
          if [ "$INSTALL_RC" -eq 0 ]; then
            python research/irp27_decision_contract_compiler/work/src/run_laya_shadow.py \
              --cases "$RAW/cases.jsonl" \
              --flip-cases "$RAW/cases-flip.jsonl" \
              --output "$LIVE" \
              --limit 12 \
              --checkpoints english multilingual typed-decisions
            RUN_RC=$?
          fi
          set -e
          if [ ! -f "$LIVE/live_laya_status.json" ]; then
            python - <<PY
          import json
          from pathlib import Path
          Path("$LIVE/live_laya_status.json").write_text(json.dumps({
              'attempted': True,
              'started_at_utc': "$START",
              'completed': False,
              'install_returncode': $INSTALL_RC,
              'run_returncode': $RUN_RC,
              'checkpoints': {},
              'error_boundary': 'LIVE_LAYA_INCOMPLETE_OR_BLOCKED',
              'provider_has_authority': False,
              'automatic_execution': False,
              'automatic_publication': False
          }, indent=2)+'\n')
          PY
          fi
          cat "$LIVE/live_laya_status.json"
          exit 0

      - name: Record material provider availability
        env:
          PYTHONPATH: research/irp27_decision_contract_compiler/work/src
        run: |
          OUT="$RUNNER_TEMP/irp27_gate011"
          python research/irp27_decision_contract_compiler/work/src/provider_availability.py \
            > "$OUT/provider_availability.json"
          cat "$OUT/provider_availability.json"

      - name: Build scientific closure and navigable lab
        env:
          PYTHONPATH: research/irp27_decision_contract_compiler/work/src
        run: |
          OUT="$RUNNER_TEMP/irp27_gate011"
          mkdir -p "$OUT/report"
          python research/irp27_decision_contract_compiler/work/src/build_gate011_report.py \
            --compiled "$OUT/compiled" \
            --external "$OUT/shadow_benchmark" \
            --availability "$OUT/provider_availability.json" \
            --live "$OUT/live_laya" \
            --output "$OUT/report"

      - name: Assemble reproducible Gate 011 artifact
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/irp27_gate011"
          ROOT="research/irp27_decision_contract_compiler/work"
          mkdir -p "$OUT/src" "$OUT/contracts" "$OUT/protocols" "$OUT/formal" "$OUT/reports"
          cp "$ROOT/src/"*.py "$OUT/src/"
          cp "$ROOT/tests/"*.py "$OUT/src/"
          cp "$ROOT/contracts/"*.json "$OUT/contracts/"
          cp "$ROOT/protocols/"*.json "$OUT/protocols/"
          cp "$OUT/compiled/CompiledContract.lean" "$OUT/formal/"
          cp "$OUT/formal_contract_verification.json" "$OUT/formal/"
          cp "$OUT/report/"*.md "$OUT/reports/" 2>/dev/null || true
          cp "$OUT/report/"*.html "$OUT/" 2>/dev/null || true
          cp "$OUT/report/GATE_DECISION_v2.0.json" "$OUT/"
          cp "$OUT/report/status.json" "$OUT/reports/report_status.json"
          cp research/irp27_lean_decision_governance/DecisionGov/Kernel.lean "$OUT/formal/Kernel.lean"
          cp research/irp27_lean_decision_governance/lean-toolchain "$OUT/formal/"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("${{ runner.temp }}/irp27_gate011")
          live=json.loads((root/'live_laya/live_laya_status.json').read_text())
          decision=json.loads((root/'GATE_DECISION_v2.0.json').read_text())
          summary={
              'gate': decision['gate'],
              'contract_hash': decision['contract_hash'],
              'compiler': decision['contract_compiler'],
              'formal_contract_verification': True,
              'shadow_reanalysis': decision['external_published_raw_outputs_reanalysis'],
              'live_laya_attempted': decision['live_laya_attempted'],
              'live_laya_completed': decision['live_laya_completed'],
              'live_jev_completed': False,
              'live_nimble_completed': False,
              'provider_promotion': 'BLOCKED',
              'execution_authority': 'NONE',
              'automatic_execution': False,
              'automatic_publication': False,
          }
          (root/'STATUS_v2.0.json').write_text(json.dumps(summary,indent=2)+'\n')
          lines=[]
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'MANIFEST.sha256':
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}")
          (root/'MANIFEST.sha256').write_text('\n'.join(lines)+'\n')
          print({'manifest_entries':len(lines),'live_laya':live,'summary':summary})
          PY

      - name: Print exact gate state
        if: always()
        run: |
          OUT="$RUNNER_TEMP/irp27_gate011"
          cat "$OUT/STATUS_v2.0.json" || true
          cat "$OUT/GATE_DECISION_v2.0.json" || true
          cat "$OUT/shadow_benchmark/shadow_benchmark.json" || true
          cat "$OUT/live_laya/live_laya_status.json" || true
          du -sh "$OUT" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irp27-decision-contract-compiler-v20
          path: ${{ runner.temp }}/irp27_gate011
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce formal, statistical and authority boundaries
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("${{ runner.temp }}/irp27_gate011")
          compiler=json.loads((root/'compiled/compiler_manifest.json').read_text())
          formal=json.loads((root/'formal/formal_contract_verification.json').read_text())
          shadow=json.loads((root/'shadow_benchmark/shadow_benchmark.json').read_text())
          decision=json.loads((root/'GATE_DECISION_v2.0.json').read_text())
          status=json.loads((root/'STATUS_v2.0.json').read_text())
          assert compiler['semantic_invariants']['provider_conveys_authority'] is False
          assert compiler['semantic_invariants']['automatic_execution'] is False
          assert compiler['semantic_invariants']['automatic_publication'] is False
          assert compiler['semantic_invariants']['future_only_lease'] is True
          assert formal['verified'] is True
          assert formal['contract_hash'] == compiler['contract_hash']
          assert shadow['source'] == 'EXTERNAL_PUBLISHED_RAW_OUTPUTS_REANALYSIS'
          assert shadow['provider_results_are_not_new_live_calls'] is True
          assert {'laya_public_raw','jev_public_raw'} <= set(shadow['providers'])
          assert decision['provider_promotion'] == 'BLOCKED'
          assert decision['execution_authority'] == 'NONE'
          assert status['automatic_execution'] is False
          assert status['automatic_publication'] is False
          assert status['live_jev_completed'] is False
          assert status['live_nimble_completed'] is False
          assert (root/'MANIFEST.sha256').exists()
          print('GATE SOTA-011 BOUNDARY PASS')
          PY
